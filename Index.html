<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta 72</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#f6f8fb}
header{display:flex;justify-content:space-between;padding:14px;background:white;border-bottom:1px solid #ddd}
.logo{font-weight:900;color:#ea580c}
.card{border:2px solid #2563eb;border-radius:18px;padding:16px;background:white;margin-bottom:14px}
.title{font-size:12px;font-weight:800;color:#475569;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:12px;font-size:18px;font-weight:700;text-align:center}
.result{background:#eff6ff;border-radius:12px;padding:12px;display:flex;justify-content:space-between;margin-top:12px}
.big{font-size:20px;font-weight:900;color:#1e40af}
.blue{color:#3b82f6;font-size:10px;font-weight:800}
.resumen{position:fixed;bottom:0;left:0;right:0;background:#1e293b;color:white;padding:14px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header><div class="logo">🍕 Ruta 72 Santiago</div><div style="background:#ffedd5;padding:6px 12px;border-radius:20px;font-size:11px">MODO LOCAL</div></header>
<div style="padding:14px;max-width:620px;margin:0 auto;padding-bottom:80px">
<h3>CALCULADORA FRIO</h3>
<div class="card"><div class="title">QUESO PIZZA (6x2KG)</div><div class="grid"><div><input class="input" id="a-j" type="number" placeholder="0" oninput="c()"><div style="font-size:9px;text-align:center">JABAS</div></div><div><input class="input" id="a-b" type="number" placeholder="0" oninput="c()"><div style="font-size:9px;text-align:center">BOLSAS</div></div></div><div class="result"><div><div class="blue">BOLSAS</div><div class="big" id="a-t">0</div></div><div><div class="blue">PESO</div><div class="big" id="a-p">0kg</div></div></div></div>
<div class="card"><div class="title">QUESO PEPE (4x5.67KG)</div><div class="grid"><div><input class="input" id="b-j" type="number" placeholder="0" oninput="c()"><div style="font-size:9px;text-align:center">JABAS</div></div><div><input class="input" id="b-b" type="number" placeholder="0" oninput="c()"><div style="font-size:9px;text-align:center">BOLSAS</div></div></div><div class="result"><div><div class="blue">BOLSAS</div><div class="big" id="b-t">0</div></div><div><div class="blue">PESO</div><div class="big" id="b-p">0kg</div></div></div></div>
<div class="card"><div class="title">PASTA TOMATE (12x3KG)</div><div class="grid"><div><input class="input" id="c-j" type="number" placeholder="0" oninput="c()"><div style="font-size:9px;text-align:center">JABAS</div></div><div><input class="input" id="c-b" type="number" placeholder="0" oninput="c()"><div style="font-size:9px;text-align:center">BOLSAS</div></div></div><div class="result"><div><div class="blue">BOLSAS</div><div class="big" id="c-t">0</div></div><div><div class="blue">PESO</div><div class="big" id="c-p">0kg</div></div></div></div>
<div class="card"><div class="title">QUESO TIRAS (6.8KG)</div><div class="grid"><div style="grid-column:span 2"><input class="input" id="d-b" type="number" placeholder="0" oninput="c()"></div></div><div class="result"><div><div class="blue">BOLSAS</div><div class="big" id="d-t">0</div></div><div><div class="blue">PESO</div><div class="big" id="d-p">0kg</div></div></div></div>
<div class="card"><div class="title">QUESO QBM (3x5KG)</div><div class="grid"><div><input class="input" id="e-j" type="number" placeholder="0" oninput="c()"></div><div><input class="input" id="e-b" type="number" placeholder="0" oninput="c()"></div></div><div class="result"><div><div class="blue">BOLSAS</div><div class="big" id="e-t">0</div></div><div><div class="blue">PESO</div><div class="big" id="e-p">0kg</div></div></div></div>
</div>
<div class="resumen"><div>TOTAL: <b id="tk">0kg</b></div><div><b id="tb">0 bolsas</b></div></div>
<script>
function c(){
let f=(j,b,xj,xb,o,t,p)=>{let J=0,B=0;if(o){B=parseFloat(document.getElementById(j).value)||0}else{J=parseFloat(document.getElementById(j).value)||0;B=parseFloat(document.getElementById(b).value)||0}let tot=o?B:J*xj+B;let pe=tot*xb;document.getElementById(t).innerText=tot;document.getElementById(p).innerText=pe.toFixed(2)+'kg';return[tot,pe]};
let r1=f('a-j','a-b',6,2,false,'a-t','a-p');let r2=f('b-j','b-b',4,5.67,false,'b-t','b-p');let r3=f('c-j','c-b',12,3,false,'c-t','c-p');let r4=f('d-b',null,1,6.8,true,'d-t','d-p');let r5=f('e-j','e-b',3,5,false,'e-t','e-p');
document.getElementById('tk').innerText=(r1[1]+r2[1]+r3[1]+r4[1]+r5[1]).toFixed(2)+'kg';document.getElementById('tb').innerText=(r1[0]+r2[0]+r3[0]+r4[0]+r5[0])+' bolsas';
}
</script>
</body>
  </html>
